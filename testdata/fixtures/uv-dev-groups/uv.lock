version = 1
revision = 3
requires-python = ">=3.11"

[[package]]
name = "group-app"
version = "1.0.0"
source = { virtual = "." }
dependencies = [{ name = "core" }]
[package.optional-dependencies]
image = [{ name = "pillow" }]
[package.dev-dependencies]
dev = [{ name = "pytest" }]
docs = [{ name = "sphinx", marker = "sys_platform == 'linux'" }]

[[package]]
name = "core"
version = "1.0.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pillow"
version = "11.0.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "pytest"
version = "8.0.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "sphinx"
version = "8.0.0"
source = { registry = "https://pypi.org/simple" }
