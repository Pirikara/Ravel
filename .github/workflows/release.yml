name: Release draft

on:
  push:
    tags: ['v*-beta.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing beta tag to verify without changing its release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and notes
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]
          test -f "docs/releases/$RELEASE_TAG.md"
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./... -count=1
      - run: go vet ./...
      - name: Build release archives
        run: bash scripts/build-release.sh "$RELEASE_TAG" dist
      - name: Verify checksums
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS
      - name: Render release notes
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          repo = os.environ['GITHUB_REPOSITORY']
          root = Path.cwd().resolve()
          notes = root / 'docs' / 'releases' / f'{tag}.md'
          body = notes.read_text()

          def link(match):
              target = match.group(1)
              if target.startswith(('https://', 'http://', '#')):
                  return match.group(0)
              relative, marker, fragment = target.partition('#')
              resolved = (notes.parent / relative).resolve()
              path = resolved.relative_to(root)
              if not resolved.is_file():
                  raise ValueError(f'missing release note link: {target}')
              url = f'https://github.com/{repo}/blob/{tag}/{path.as_posix()}'
              if marker:
                  url += f'#{fragment}'
              return f']({url})'

          rendered = re.sub(r'\]\(([^)]+)\)', link, body)
          (root / 'release-notes.md').write_text(rendered)
          PY
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 14

  draft:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-${{ env.RELEASE_TAG }}
      - name: Verify downloaded assets
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag \
            --title "Ravel $RELEASE_TAG" --notes-file release-notes.md
